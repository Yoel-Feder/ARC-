<!-- Built file: styles.css, curriculum.js and app.js are inlined below so the page loads as one document. -->
<style>
/* ARC — "Light and clean" theme (option A)
   Colors, fonts and sizes are defined once here as variables. Change them here to restyle the whole site. */
:root {
  --bg: #FFFFFF;
  --surface: #FAFAF8;        /* soft panels */
  --surface-2: #F3F3F0;      /* chips, inline code */
  --line: #E7E7E3;           /* borders */
  --line-strong: #D9D9D4;
  --text: #1A1A1A;
  --text-2: #33332F;         /* body text */
  --muted: #5F5F5A;          /* secondary text (passes contrast on white) */
  --accent: #2563EB;         /* blue */
  --accent-text: #1D4ED8;
  --accent-soft: #EFF4FF;
  --good-bg: #F0FDF4; --good-line: #BBE5C8; --good-text: #14532D;
  --bad-bg: #FEF2F2;  --bad-line: #F5C2C2;  --bad-text: #7F1D1D;
  --warn-bg: #FFF8E6; --warn-line: #F3DFA8; --warn-text: #4A3B0F;
  --console: #1A1A1A; --console-text: #F5F5F2; --console-muted: #A3A39C; --console-error: #FCA5A5;
  --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
  --radius: 12px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: #2563EB33; }
code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); padding: 1px 6px; border-radius: 4px; }
h1, h2, h3 { margin: 0; }

/* ---------- Small helpers ---------- */
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.end { justify-content: flex-end; }
.flex1 { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); }
.eyebrow.quiet { color: var(--muted); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--text); font-size: 14px; font-weight: 500; transition: background .15s, border-color .15s; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--surface); border-color: #BDBDB6; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #FFFFFF; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent-text); border-color: var(--accent-text); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn.sm { padding: 7px 12px; font-size: 13px; }
.btn.wide { width: 100%; padding: 13px 18px; font-size: 15px; }
.btn.icon { width: 36px; height: 36px; padding: 0; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent-text); font-weight: 600; font-size: 15px; }
.link-btn:hover { text-decoration: underline; }

/* ---------- Header ---------- */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 32px; background: #FFFFFFF2; backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar-left, .topbar-right { display: flex; align-items: center; gap: 20px; }
.topbar-right { gap: 14px; font-size: 14px; color: var(--muted); }
.brand { background: none; border: 0; padding: 4px 0; font-family: var(--serif); font-weight: 700; font-size: 24px; letter-spacing: .02em; color: var(--text); }
.topnav { display: flex; gap: 2px; }
.nav-link { background: none; border: 0; padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
.nav-link:hover { background: var(--surface-2); color: var(--text); }
.nav-link.active { color: var(--text); background: var(--surface-2); }
.progress-track { width: 140px; height: 6px; background: #EEEEEA; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
.xp { color: var(--text); font-weight: 600; white-space: nowrap; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; width: 38px; height: 38px; font-size: 18px; }

/* ---------- Page layout ---------- */
.main { max-width: 1240px; margin: 0 auto; padding: 44px 32px 72px; }
.page { display: flex; flex-direction: column; gap: 14px; }
.page-title { font-family: var(--serif); font-size: 42px; line-height: 1.1; font-weight: 700; }
.lead { margin: 0 0 14px; font-size: 17px; line-height: 1.65; color: var(--muted); max-width: 680px; }
.section-title { font-size: 20px; font-weight: 600; margin: 24px 0 4px; }

/* ---------- Lesson ---------- */
.lesson-grid { display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start; }
.lesson-main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 36px; }
.lesson-side { flex: 1 1 400px; min-width: 0; position: sticky; top: 84px; scroll-margin-top: 84px; }
.lesson-head { display: flex; flex-direction: column; gap: 12px; }
.lesson-title { font-family: var(--serif); font-size: 44px; line-height: 1.1; font-weight: 700; }
.steps { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.step { padding: 6px 12px; border-radius: 999px; border: 0; background: var(--surface-2); color: #3F3F3B; font-size: 13px; font-weight: 500; }
.step:hover { background: #E8E8E4; }
.step.first { background: var(--text); color: #FFFFFF; font-weight: 600; }
.lesson-section { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 84px; }
.lesson-section h2 { font-size: 20px; font-weight: 600; }
.prose p { margin: 0 0 14px; font-size: 17px; line-height: 1.7; color: var(--text-2); }
.prose p:last-child { margin-bottom: 0; }
.prose strong { color: var(--text); }

.see { display: flex; align-items: stretch; gap: 16px; flex-wrap: wrap; padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.see-box { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.see-label { font-size: 12px; color: var(--muted); }
.see-arrow { align-self: center; font-size: 22px; color: #8A8A84; }
.see .console { margin: 0; flex: 1; }

.code-block { margin: 0; padding: 16px 18px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 10px; font-family: var(--mono); font-size: 14px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
.console { padding: 14px 16px; border-radius: 10px; background: var(--console); color: var(--console-text); font-family: var(--mono); font-size: 13.5px; line-height: 1.7; overflow-wrap: anywhere; max-height: 240px; overflow-y: auto; }
.console-line.muted { color: var(--console-muted); }
.console-line.error { color: var(--console-error); }

.editor { border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; background: var(--bg); }
.editor-head { display: flex; justify-content: space-between; gap: 10px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.editor-text { display: block; width: 100%; border: 0; outline: none; resize: vertical; padding: 16px 18px; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 14.5px; line-height: 1.75; tab-size: 2; white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; caret-color: var(--accent); }
.editor:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px #2563EB1F; }

.callout { padding: 16px 20px; background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px; color: var(--warn-text); }
.callout p { margin: 0; font-size: 15px; line-height: 1.6; }
.callout.neutral { background: var(--surface); border-color: var(--line); color: var(--text-2); }
.callout code { background: #00000010; }
.deeper { display: flex; flex-direction: column; gap: 14px; padding-top: 4px; border-top: 1px solid var(--line); padding-top: 22px; }

/* Your turn card */
.turn-card { display: flex; flex-direction: column; gap: 16px; padding: 26px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); box-shadow: 0 1px 2px #0000000A, 0 8px 24px #0000000A; }
.task p { margin: 0 0 8px; font-size: 16px; line-height: 1.6; color: var(--text); }
.task p:last-child { margin-bottom: 0; }
.badge-done { font-size: 12px; font-weight: 600; color: var(--good-text); background: var(--good-bg); border: 1px solid var(--good-line); padding: 4px 10px; border-radius: 999px; }
.options { display: flex; flex-direction: column; gap: 8px; }
.option { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--bg); font-size: 15px; transition: border-color .15s, background .15s; }
.option:hover { border-color: #9DB7F5; background: var(--surface); }
.option.selected { border-color: var(--accent); background: var(--accent-soft); }
.option-key { flex: 0 0 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--muted); }
.option.selected .option-key { background: var(--accent); color: #FFFFFF; }
.feedback { padding: 14px 16px; border-radius: 10px; border: 1px solid; font-size: 15px; line-height: 1.55; animation: rise .2s ease-out; }
.feedback p { margin: 6px 0 0; }
.feedback.good { background: var(--good-bg); border-color: var(--good-line); color: var(--good-text); }
.feedback.bad { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad-text); }
.feedback code { background: #00000010; }
.hints { display: flex; flex-direction: column; gap: 8px; }
.hint { padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); color: #1E2A4A; font-size: 14.5px; line-height: 1.55; }
.hint b { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 2px; }
.hint p { margin: 0; }
.turn-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 4px; }
.turn-actions.done { display: block; }

.lesson-footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--line); }
.mastery-card { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-top: 20px; padding: 22px 24px; border: 1px solid #BFD3FE; background: var(--accent-soft); border-radius: var(--radius); }
.mastery-card h3 { font-size: 18px; margin-bottom: 4px; }
.mastery-card p { margin: 0; color: var(--text-2); font-size: 15px; line-height: 1.55; }

/* ---------- Dashboard, lists ---------- */
.continue-card { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; padding: 28px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.continue-card h2 { font-family: var(--serif); font-size: 28px; margin: 6px 0 10px; }
.continue-card .prose p { font-size: 15.5px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 10px; }
.stat { padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; gap: 6px; }
.stat span { font-size: 13px; color: var(--muted); }
.stat b { font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
.stat small { font-size: 15px; color: var(--muted); font-weight: 500; }

.module-list, .course-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.module-row, .course-head { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; padding: 16px 20px; background: var(--bg); border: 0; border-bottom: 1px solid var(--line); }
.module-row:last-child, .course-module:last-child .course-head { border-bottom: 0; }
.module-row:hover, .course-head:hover { background: var(--surface); }
.module-num { font-family: var(--mono); font-size: 13px; color: var(--muted); flex: 0 0 auto; }
.module-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.module-info b { font-size: 16px; font-weight: 600; }
.module-info span { font-size: 14px; color: var(--muted); }
.module-meta { font-size: 13px; color: var(--muted); white-space: nowrap; }
.chev { width: 20px; text-align: center; color: var(--muted); font-size: 18px; }
.course-module { border-bottom: 1px solid var(--line); }
.course-module:last-child { border-bottom: 0; }
.course-module .course-head { border-bottom: 0; }
.course-body { padding: 4px 20px 18px 54px; background: var(--bg); }
.lesson-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 8px; background: none; border: 0; border-radius: 8px; font-size: 15px; }
.lesson-row:hover { background: var(--surface); }
.lesson-dot { flex: 0 0 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); font-size: 12px; color: var(--muted); }
.lesson-dot.done { background: var(--good-bg); color: var(--good-text); border: 1px solid var(--good-line); }

.skill-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.skill { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
.skill:hover { border-color: #9DB7F5; }
.skill b { font-size: 16px; font-weight: 600; }
.skill-req { font-size: 13px; color: var(--accent-text); }
.skill .progress-track { width: 100%; margin-top: 4px; }

/* ---------- Playground ---------- */
.play-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.play-main, .play-side { display: flex; flex-direction: column; gap: 12px; }
.play-side .section-title { margin: 0; }
.file-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.file-tab { padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-family: var(--mono); font-size: 13px; color: var(--muted); }
.file-tab.active { border-color: var(--text); color: var(--text); }
.file-tab.add { border-style: dashed; font-family: var(--sans); }

/* ---------- Reference, progress ---------- */
.search { width: 100%; max-width: 640px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 15px; outline: none; }
.search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #2563EB1F; }
.ref-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
.ref-item { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.ref-item:hover { border-color: #9DB7F5; }
.ref-item span { font-size: 14px; color: var(--muted); }
.empty { padding: 30px; color: var(--muted); }
.achievements { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.achievement { display: flex; flex-direction: column; gap: 6px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); }
.achievement.locked { opacity: .45; }
.ach-icon { font-size: 22px; color: var(--accent-text); }
.achievement b { font-size: 15px; }
.achievement span { font-size: 13px; color: var(--muted); }
.danger { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-top: 24px; padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius); }
.danger p { margin: 4px 0 0; }

/* ---------- Modal and toast ---------- */
.modal-cover { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 18px; background: #1A1A1A66; animation: fade .15s; }
.modal { width: 100%; max-width: 600px; max-height: 90vh; overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 26px; background: var(--bg); border-radius: 16px; box-shadow: 0 24px 60px #00000033; }
.modal h2 { font-family: var(--serif); font-size: 26px; }
.modal p { margin: 0; line-height: 1.6; color: var(--text-2); }
.toast-wrap { position: fixed; right: 24px; bottom: 24px; z-index: 90; display: grid; gap: 8px; }
.toast { padding: 12px 16px; background: var(--text); color: #FFFFFF; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px #00000026; animation: rise .2s; }

@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Smaller screens ---------- */
@media (max-width: 1000px) {
  .lesson-side { position: static; }
  .skill-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .achievements { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .play-grid { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .topbar { padding: 10px 16px; }
  .menu-btn { display: inline-grid; place-items: center; }
  .topnav { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; padding: 8px 12px 14px; background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: 0 12px 24px #0000000F; }
  .topnav.open { display: flex; }
  .nav-link { text-align: left; padding: 12px; font-size: 16px; }
  .hide-sm { display: none; }
  .main { padding: 28px 18px 56px; }
  .lesson-title, .page-title { font-size: 34px; }
  .lesson-grid { gap: 36px; }
  .see { padding: 16px; }
  .see-arrow { display: none; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { padding: 14px; }
  .stat b { font-size: 22px; }
  .ref-list { grid-template-columns: 1fr; }
  .course-body { padding: 4px 12px 14px; }
  .turn-card { padding: 20px; }
  .toast-wrap { left: 16px; right: 16px; bottom: 16px; }
}
@media (max-width: 480px) {
  .skill-grid { grid-template-columns: 1fr; }
  .lesson-title, .page-title { font-size: 30px; }
  .prose p { font-size: 16px; }
}

/* =====================================================================
   Futuristic layer: precise, technical details on top of the light theme.
   ===================================================================== */
:root { --cyan: #06B6D4; --glow: 0 0 0 1px #2563EB22, 0 6px 24px -6px #2563EB55; }

/* Glowing progress line along the bottom of the header */
.topbar { position: sticky; }
.header-line { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: transparent; }
.header-line div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--cyan)); box-shadow: 0 0 12px #06B6D499; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.brand::after { content: ''; display: inline-block; width: 6px; height: 6px; margin-left: 4px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); vertical-align: super; }

/* Monospace labels give a technical feel */
.eyebrow.mono, .sec-num, .step-n, .q-num, .see-label, .rules-label, .check-meta, .step-status, .editor-head, .tok-num { font-family: var(--mono); }
.eyebrow.mono { letter-spacing: .06em; font-size: 12px; }
.see-label { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }

/* Lesson header: a faint dot grid behind the title */
.lesson-head { position: relative; padding: 8px 0 4px; }
.lesson-head::before { content: ''; position: absolute; inset: -28px -32px -10px -32px; z-index: -1; background-image: radial-gradient(#2563EB1A 1px, transparent 1.2px); background-size: 18px 18px; -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 90%); mask-image: linear-gradient(180deg, #000 0%, transparent 90%); }

/* Section navigation pills and numbered section headings */
.step { display: inline-flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); }
.step:hover { border-color: #9DB7F5; background: var(--accent-soft); }
.step-n { font-size: 11px; color: var(--accent-text); }
.sec-h { display: flex; align-items: baseline; gap: 12px; font-size: 22px; font-weight: 600; }
.sec-num { font-size: 12px; font-weight: 500; color: var(--accent-text); padding: 2px 7px; border: 1px solid #BFD3FE; border-radius: 6px; background: var(--accent-soft); transform: translateY(-2px); }
.prose.how { padding-left: 16px; border-left: 2px solid; border-image: linear-gradient(180deg, var(--accent), var(--cyan)) 1; }
.prose ol, .prose ul { margin: 0 0 14px; padding-left: 22px; }

/* Code colors */
.t-com { color: #6B6B65; font-style: italic; }
.t-str { color: #B45309; }
.t-num { color: #0E7490; }
.t-key { color: #6D28D9; }

/* How to write it: numbered code pieces */
.anatomy { display: flex; flex-direction: column; gap: 18px; padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.anatomy-code { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px; padding: 18px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 10px; }
.tok { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; }
.tok-text { font-size: 18px; padding: 6px 10px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 6px; white-space: pre; transition: border-color .15s, box-shadow .15s; }
.tok:hover .tok-text { border-color: var(--accent); box-shadow: var(--glow); }
.tok-num { font-size: 11px; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; background: var(--text); color: #FFFFFF; }
.anatomy-list { margin: 0; padding: 0; list-style: none; counter-reset: part; display: flex; flex-direction: column; gap: 10px; }
.anatomy-list li { counter-increment: part; display: grid; grid-template-columns: 28px minmax(80px, auto) 1fr; gap: 12px; align-items: baseline; font-size: 15.5px; line-height: 1.55; color: var(--text-2); }
.anatomy-list li::before { content: counter(part); font-family: var(--mono); font-size: 12px; color: var(--accent-text); }
.anatomy-list li code { justify-self: start; white-space: pre; }
.rules { border-top: 1px dashed var(--line-strong); padding-top: 14px; }
.rules-label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rules ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.55; color: var(--text-2); }

/* Step-through: line numbers, the line that just ran, and the next line */
.stepper { align-items: stretch; }
.stepper .see-box:first-child { flex: 1.2 1 300px; }
.code-block.lines { padding: 10px 0; white-space: normal; }
.ln { display: flex; gap: 14px; padding: 1px 18px 1px 0; border-left: 3px solid transparent; transition: background .2s, border-color .2s; }
.ln-n { flex: 0 0 34px; text-align: right; color: #A3A39C; font-size: 12px; user-select: none; }
.ln-t { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.75em; }
.ln.ran { opacity: .55; }
.ln.current { background: var(--accent-soft); border-left-color: var(--accent); box-shadow: inset 0 0 0 1px #2563EB14; }
.ln.current .ln-n { color: var(--accent-text); font-weight: 600; }
.ln.current.error { background: var(--bad-bg); border-left-color: #DC2626; }
.ln.next .ln-n::before { content: '▸ '; color: var(--cyan); }
.step-status { margin: 0; font-size: 12.5px; color: var(--muted); min-height: 1.4em; }
.console { position: relative; }
.console::after { content: '▍'; display: block; color: var(--cyan); animation: blink 1.1s steps(1) infinite; line-height: 1; margin-top: 2px; }

/* Quick check */
.quiz-q { display: flex; flex-direction: column; gap: 12px; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); transition: border-color .2s; }
.quiz-q.solved { border-color: var(--good-line); }
.q-head { display: flex; justify-content: space-between; align-items: center; }
.q-num { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.option:disabled { opacity: 1; cursor: default; }
.option.correct { border-color: #16A34A; background: var(--good-bg); }
.option.correct .option-key { background: #16A34A; color: #FFFFFF; }
.option.wrong { border-color: #DC2626; background: var(--bad-bg); animation: shake .3s; }
.option.wrong .option-key { background: #DC2626; color: #FFFFFF; }
.option code { font-size: .95em; }
.quiz-q.solved .option:not(.correct) { opacity: .55; }

/* Side card checklist */
.side-title { font-family: var(--serif); font-size: 24px; }
.checklist { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px dashed var(--line-strong); border-radius: 10px; }
.check-item { display: flex; align-items: center; gap: 10px; padding: 6px 4px; background: none; border: 0; text-align: left; font-size: 14.5px; font-weight: 500; }
button.check-item:hover { color: var(--accent-text); }
.check-dot { width: 20px; height: 20px; flex: 0 0 20px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--line-strong); font-size: 11px; color: #FFFFFF; }
.check-item.done .check-dot { background: #16A34A; border-color: #16A34A; box-shadow: 0 0 0 3px #16A34A22; }
.check-meta { margin-left: auto; font-size: 12px; color: var(--muted); }
.center { text-align: center; margin: 0; }

/* Buttons: a soft glow on the main action */
.btn.primary { box-shadow: 0 1px 0 #FFFFFF33 inset, 0 4px 14px -4px #2563EB80; }
.btn.primary:hover:not(:disabled) { box-shadow: var(--glow); }
.btn.wide { letter-spacing: .01em; }

/* Entrance animation, only when a new lesson opens */
.lesson-grid.enter .lesson-head, .lesson-grid.enter .lesson-section, .lesson-grid.enter .callout, .lesson-grid.enter .lesson-side { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
.lesson-grid.enter .lesson-section:nth-of-type(1) { animation-delay: .05s; }
.lesson-grid.enter .lesson-section:nth-of-type(2) { animation-delay: .1s; }
.lesson-grid.enter .lesson-section:nth-of-type(3) { animation-delay: .15s; }
.lesson-grid.enter .lesson-side { animation-delay: .12s; }

@keyframes blink { 50% { opacity: 0; } }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

@media (max-width: 820px) {
  .anatomy { padding: 16px; }
  .anatomy-list li { grid-template-columns: 22px 1fr; }
  .anatomy-list li code { grid-column: 2; }
  .anatomy-list li div { grid-column: 2; }
  .tok-text { font-size: 15px; padding: 5px 8px; }
  .lesson-head::before { inset: -20px -18px -10px -18px; }
  .quiz-q { padding: 16px; }
}

</style>

<body>
<div id="app"></div>
<script>
/*
  ARC curriculum: all lesson content lives here. No code changes needed to edit a lesson.

  LESSON FORMAT (Subject 1 uses this; older modules use the older format below and still work)
    id        Permanent name. Saved progress is linked to it, so don't rename it once published.
    title     Lesson name.
    concept   Short tag shown above the title.
    explain   "The idea": the plain-language explanation.
    how       "How it works": what happens under the hood.
    syntax    "How to write it": { parts: [[code piece, explanation], ...], rules: [ ... ] }
    example   Example code for "See it happen" and "Try it".
    stepper   true = show a step-through (Step ▸ runs one line at a time). Only for examples where
              every line is a complete statement.
    exampleShowsError  true if the example is *meant* to show an error.
    mistake   "Common mistake" note.
    quiz      Quick check: [{ question, code?, options, answer, explain, feedback }]
              answer = position of the right option, counting from 0.
              explain = shown when they pick the right answer: say *why* it's right.
              feedback = one message per option for wrong picks (null for the right one).
    exercise  null, or { task, starter, tests, hints, success }
              tests: "expr" is evaluated after the student's code and must equal "expect".
              Inside expr you can use __logs (the printed lines) and __source (the student's code).
    A lesson is complete when every quiz question is answered correctly and the exercise passes.

  OLDER FORMAT (modules 2-12, until they're rewritten)
    type "code": task, starter, tests, hints, success      type "choice": task, code, options, answer, feedback
    deep: shown as "How it works".

  Each module can have a "mastery" list: new problems (task, starter, tests), solved without hints.

  Text formatting: a blank line starts a new paragraph, `code`, **bold**, *italic*.
  Hint rule: the last hint points at the mechanism. It never just hands over the answer.
*/
const MODULES = [
  {
    id: "how-programming-works",
    title: "How programming works",
    subtitle: "From zero: what code is, how a computer runs it, and how to write and read it",
    icon: "◎",
    color: "#2563EB",
    lessons: [
      // ───────────────────────── 1 ─────────────────────────
      {
        id: "what-is-programming",
        title: "What is programming?",
        concept: "Programs",
        explain: `A computer is incredibly fast, but it has no judgment. It can't figure out what you *meant*. It can only follow instructions.

A **program** is a list of those instructions. **Programming** is the skill of writing them: taking a goal and breaking it into small, exact steps.

Think of a recipe. It lists precise steps, in order. If a recipe says "add sugar" when it should say "add salt", a human cook might notice. A computer never would. It does exactly what's written, every time.`,
        how: `The computer's processor (the **CPU**) only understands very simple operations: add two numbers, compare two numbers, move a value from here to there. It runs billions of them every second.

Nobody writes those tiny operations by hand anymore. Instead, we write in a **programming language** like JavaScript, which people can read. Another program then translates it into the processor's tiny operations.

So every piece of code has two readers: the computer, which needs it *exact*, and people (including future you), who need it *clear*.`,
        example: `console.log("Step 1: Boil water");
console.log("Step 2: Add pasta");
console.log("Step 3: Wait 10 minutes");`,
        stepper: true,
        mistake: "Expecting the computer to understand what you *meant*. It only does what you *wrote*. Most bugs are the gap between the two.",
        quiz: [
          {
            question: "What is a program?",
            options: ["A list of exact instructions for a computer", "A computer that thinks for itself", "A website"],
            answer: 0,
            explain: "A program is a list of instructions. The computer follows them exactly, in order.",
            feedback: [null, "Computers don't think or guess. They follow instructions, nothing more.", "A website can be *built from* programs, but a program is any list of instructions for a computer."]
          },
          {
            question: "Your instructions say \"add sugar\", but you meant salt. What does the computer do?",
            options: ["Adds salt, because that's obviously right", "Adds sugar, exactly as written", "Stops and asks what you meant"],
            answer: 1,
            explain: "A computer follows what's written, not what you meant. That's why precise code matters so much.",
            feedback: ["The computer can't know what you meant. It only sees the instruction.", null, "Computers don't ask questions. They run the instruction, or stop with an error if they can't."]
          },
          {
            question: "Why do people write code in languages like JavaScript instead of the processor's own instructions?",
            options: ["The processor understands JavaScript directly", "JavaScript is readable for people, and it gets translated for the processor", "Processors can't run programs any other way"],
            answer: 1,
            explain: "Programming languages exist for *people*. They're translated into the tiny operations the processor actually runs.",
            feedback: ["The processor only understands very simple operations. JavaScript has to be translated first.", null, "Processors could run their own instructions directly. It's just far too slow and painful for people to write them."]
          }
        ],
        exercise: null
      },

      // ───────────────────────── 2 ─────────────────────────
      {
        id: "what-is-javascript",
        title: "What is JavaScript?",
        concept: "The language",
        explain: `**JavaScript** is the programming language of the web. Every major browser (Chrome, Safari, Firefox, Edge) can run it. When a website reacts to a click, updates without reloading, or shows live data, that's usually JavaScript.

It also runs outside the browser: on servers, in desktop apps, and in tools, using a program called **Node.js**. One language takes you from the page someone sees to the server behind it.

One heads-up: **JavaScript is not Java.** The similar name was a marketing decision in 1995. They're completely different languages.`,
        how: `Every browser contains a **JavaScript engine**, the program that runs JavaScript. Chrome's engine is called V8.

When you run code, the engine:

1. **Reads** your text and checks its grammar. This is called *parsing*.
2. **Translates** it into instructions the computer can execute.
3. **Runs** those instructions, one step at a time.

On this site, your code runs in a sealed-off part of your browser. Nothing you write here can break the website or your computer, so experiment freely.`,
        example: `console.log("This line was run by the JavaScript engine in your browser.");`,
        mistake: "Thinking you need to install something before you can start. Every browser already has a JavaScript engine built in.",
        quiz: [
          {
            question: "Where can JavaScript run?",
            options: ["Only inside web browsers", "In browsers, and also on servers and in apps using Node.js", "Only on Apple devices"],
            answer: 1,
            explain: "JavaScript started in the browser, but with Node.js it runs almost anywhere.",
            feedback: ["It started in browsers, but Node.js lets it run on servers and in apps too.", null, "JavaScript runs on every major operating system and browser."]
          },
          {
            question: "Are Java and JavaScript the same language?",
            options: ["Yes, JavaScript is the short name for Java", "No, they are different languages with similar names", "JavaScript is an older version of Java"],
            answer: 1,
            explain: "Different languages, different rules. The similar name was a 1990s marketing choice.",
            feedback: ["They only share part of a name. They're separate languages.", null, "They're unrelated languages, not versions of each other."]
          },
          {
            question: "What does the JavaScript engine do *first* with your code?",
            options: ["Runs the last line", "Reads it and checks the grammar", "Sends it to the internet"],
            answer: 1,
            explain: "The engine parses (reads and grammar-checks) the whole program before running anything. That's why one grammar mistake stops *everything*. You'll see this in lesson 9.",
            feedback: ["Programs run from the top, and only after they've been read and checked.", null, "Your code runs right here in your browser. Nothing is sent anywhere."]
          }
        ],
        exercise: null
      },

      // ───────────────────────── 3 ─────────────────────────
      {
        id: "your-first-instruction",
        title: "Your first instruction",
        concept: "console.log",
        explain: `Time to write code. The most useful first instruction is \`console.log\`. It prints a message to the **console**, a panel where programs report what they're doing.

Users never see the console. It's for you, the developer. You'll use it constantly to check what your code is really doing.`,
        how: `\`console\` is a built-in **object**: a bundle of related tools that JavaScript gives you for free. \`log\` is one of its **methods**, an action it can perform.

Putting parentheses after a method's name **calls** it, which means "do this now, using what's inside". The text in quotes is the input.

You'll learn objects and methods properly later. For now, read \`console.log(...)\` as "print this".`,
        syntax: {
          parts: [
            ["console", "The built-in **console** object, where messages go."],
            [".", "The dot means *look inside*: get something that belongs to `console`."],
            ["log", "The action: print one line."],
            ["(", "Opens the input."],
            ["\"Hello!\"", "The value to print. The quotes mark it as text."],
            [")", "Closes the input."],
            [";", "Ends the statement, like a period ends a sentence."]
          ],
          rules: [
            "Spelling and capital letters matter. `Console.log` and `console.Log` won't work.",
            "Every `(` needs a matching `)`, and every opening quote needs a closing quote.",
            "One complete instruction is called a **statement**. End each one with `;`."
          ]
        },
        example: `console.log("Hello!");
console.log("I'm learning JavaScript.");`,
        stepper: true,
        mistake: "Changing capital letters. JavaScript is **case-sensitive**: `console` and `Console` are two different names.",
        quiz: [
          {
            question: "In `console.log(\"Hi\");`, what does `log` do?",
            options: ["Prints a line to the console", "Saves a file", "Builds a web page"],
            answer: 0,
            explain: "`log` is the action. `console.log(...)` prints whatever is inside the parentheses.",
            feedback: [null, "Nothing is saved. `log` just prints a line to the console.", "`log` only prints to the console, which users don't see."]
          },
          {
            question: "Which line is written correctly?",
            options: ["`Console.log(\"Hi\");`", "`console.log(\"Hi\");`", "`console.log(\"Hi\";`"],
            answer: 1,
            explain: "Lowercase `console`, a dot, `log`, then the value inside matching parentheses and quotes, and a semicolon at the end.",
            feedback: ["`Console` with a capital C is a different name. JavaScript is case-sensitive.", null, "The closing parenthesis is missing. Every `(` needs a `)`."]
          },
          {
            question: "What does the semicolon `;` at the end do?",
            options: ["Ends the statement", "Starts a comment", "Prints a blank line"],
            answer: 0,
            explain: "A semicolon marks the end of one complete instruction, a statement.",
            feedback: [null, "Comments start with `//`. You'll meet them in lesson 5.", "It doesn't print anything. It just marks where the statement ends."]
          }
        ],
        exercise: {
          task: "Write a program from scratch. It should print `Hello, world!` on the first line and `I am learning JavaScript` on the second.",
          starter: `// Write your two lines below this comment
`,
          tests: [
            { expr: "__logs.join(\"|\")", expect: "Hello, world!|I am learning JavaScript" }
          ],
          hints: [
            "You need two `console.log` statements, one for each line of output.",
            "Copy the shape exactly: `console.log(\"...\");`. Only the text inside the quotes changes."
          ],
          success: "You wrote two complete statements from scratch, and each one printed its own line."
        }
      },

      // ───────────────────────── 4 ─────────────────────────
      {
        id: "top-to-bottom",
        title: "Top to bottom",
        concept: "Execution order",
        explain: `JavaScript runs your statements **in order, from top to bottom, one at a time**. It finishes each one before starting the next.

That means you can predict what a program does *without running it*: start at the first line and walk down. Reading code and predicting what it does is the most important skill in this course. It's how you'll check code written by other people, or by AI.`,
        how: `The engine keeps track of **where it is**, like a finger on a recipe. It runs the statement under the finger, moves the finger down one statement, and repeats until there's nothing left.

Later you'll learn tools that move the finger in other ways: conditions skip lines, loops jump back up, and functions jump somewhere else and come back. But it's always one step at a time.

Use **Step** below to move the finger yourself.`,
        example: `console.log("3");
console.log("2");
console.log("1");
console.log("Liftoff!");`,
        stepper: true,
        mistake: "Reading code the way it *should* work instead of the way it's *written*. Trace what's actually there, line by line.",
        quiz: [
          {
            question: "What does this program print first?",
            code: `console.log("A");
console.log("B");
console.log("C");`,
            options: ["A", "C", "All three at the same moment"],
            answer: 0,
            explain: "The first statement runs first. Then B, then C.",
            feedback: [null, "JavaScript doesn't read bottom-up. The top line runs first.", "Statements run one at a time, in order, even though it happens very fast."]
          },
          {
            question: "What's the output of this program?",
            code: `console.log("Go!");
console.log("Ready");`,
            options: ["Ready, then Go!", "Go!, then Ready", "Only Go!"],
            answer: 1,
            explain: "The computer doesn't know that \"Ready\" *should* come first. It prints in the order the lines are written.",
            feedback: ["That's the order that *makes sense*, but the computer follows the order that's *written*.", null, "Both lines run. Each `console.log` prints its own line."]
          }
        ],
        exercise: {
          task: "This program should print the steps for making tea in order: `Boil water`, `Add tea bag`, `Pour water`, `Wait 3 minutes`. Rearrange the lines.",
          starter: `console.log("Pour water");
console.log("Wait 3 minutes");
console.log("Boil water");
console.log("Add tea bag");`,
          tests: [
            { expr: "__logs.join(\"|\")", expect: "Boil water|Add tea bag|Pour water|Wait 3 minutes" }
          ],
          hints: [
            "Don't change any of the text. Only the order of the lines matters.",
            "Which step has to happen first in real life? Move that line to the top. You can cut a line with Ctrl/⌘ + X and paste it with Ctrl/⌘ + V."
          ],
          success: "Same four instructions, different order, different program. You fixed it by reordering, not rewriting."
        }
      },

      // ───────────────────────── 5 ─────────────────────────
      {
        id: "comments",
        title: "Comments: notes for humans",
        concept: "Comments",
        explain: `A **comment** is text that JavaScript ignores completely. It's there for people: to explain *why* the code does something, or to leave notes for later.

Programmers also use comments to switch a line off without deleting it. That's called **commenting out** a line, and it's a handy way to test what happens without it.`,
        how: `When the engine reads your program, it throws the comments away before running anything. They never reach the running program, so they can't cause errors and don't slow anything down.

In the step-through below, notice that the comment lines are skipped. The engine never stops on them.`,
        syntax: {
          parts: [
            ["console.log(\"Hi\");", "A normal statement. This runs."],
            ["//", "Starts a comment. Everything after it, to the end of the line, is ignored."],
            [" says hi", "The note itself. JavaScript skips it."]
          ],
          rules: [
            "`//` turns the rest of one line into a comment.",
            "`/*` and `*/` turn everything between them into a comment, even across several lines.",
            "Good comments explain *why*, not *what*. The code already says what it does."
          ]
        },
        example: `// This program greets a visitor
console.log("Welcome!");
// console.log("This line is switched off");
console.log("Enjoy your stay."); // a note at the end of a line`,
        stepper: true,
        mistake: "Writing comments that just repeat the code, like `// print hello` above `console.log(\"hello\")`. Explain *why* instead.",
        quiz: [
          {
            question: "What does this program print?",
            code: `// console.log("A");
console.log("B");`,
            options: ["A and B", "Only B", "Only A"],
            answer: 1,
            explain: "The first line is commented out, so the engine ignores it. Only the second statement runs.",
            feedback: ["The `//` at the start turns the whole first line into a comment, so it never runs.", null, "It's the other way around: the first line is the comment."]
          },
          {
            question: "Which comment is most useful?",
            options: ["`// print the total`", "`// prices are in cents because the payment service expects cents`", "`// code`"],
            answer: 1,
            explain: "It explains *why* something is the way it is, which the code alone can't tell you.",
            feedback: ["The code already shows that it prints a total. A good comment adds what the code can't say.", null, "This tells the reader nothing."]
          }
        ],
        exercise: {
          task: "A leftover debug line prints `testing 123`. **Comment it out** (don't delete it) so only `Order placed` and `Thank you!` print.",
          starter: `console.log("Order placed");
console.log("testing 123");
console.log("Thank you!");`,
          tests: [
            { expr: "__logs.join(\"|\")", expect: "Order placed|Thank you!" },
            { expr: "__source.includes(\"testing 123\")", expect: true }
          ],
          hints: [
            "Don't remove the line. Turn it into a comment instead.",
            "Put `//` at the very start of the debug line."
          ],
          success: "The line is still there for later, but JavaScript skips it. That's how programmers switch code off while testing."
        }
      },

      // ───────────────────────── 6 ─────────────────────────
      {
        id: "text-vs-numbers",
        title: "Text vs numbers",
        concept: "Strings and numbers",
        explain: `Every value in JavaScript has a **type**, meaning what kind of value it is. The first two types you'll use:

**Strings** are text. You write them inside quotes: \`"hello"\`, \`"42"\`, \`"3 + 4"\`.

**Numbers** are numbers, written *without* quotes: \`42\`, \`3.5\`, \`-7\`. JavaScript can do math with them.

The quotes make all the difference. \`"42"\` looks like a number, but to JavaScript it's just two characters of text.`,
        how: `When the engine reads your code, a quote mark is a signal: "everything until the matching quote is text. Don't try to understand it."

Without quotes, the engine reads the characters as code. \`42\` becomes a number value, and \`3 + 4\` becomes a calculation it works out.

JavaScript has one type for all numbers. Whole numbers and decimals (\`7\` and \`7.5\`) are both just **number**. There's no separate integer type, which surprises people coming from other languages. There are more types too (true/false values, empty values, lists and more). The next subject covers them all.`,
        syntax: {
          parts: [
            ["\"Hello\"", "A string in double quotes."],
            ["'Hello'", "Also a string. Single quotes work too, as long as they match."],
            ["42", "A number. No quotes."],
            ["3.5", "Also a number. Decimals are the same type as whole numbers."]
          ],
          rules: [
            "Quotes must match: `\"Hi'` is an error.",
            "Anything in quotes is text, even if it looks like math: `\"2 + 2\"` stays as the characters 2 + 2."
          ]
        },
        example: `console.log(3 + 4);
console.log("3 + 4");`,
        stepper: true,
        mistake: "Putting quotes around something you want calculated. `\"3 + 4\"` prints the text `3 + 4`, not `7`.",
        quiz: [
          {
            question: "What does this print?",
            code: `console.log("10 * 2");`,
            options: ["20", "10 * 2", "An error"],
            answer: 1,
            explain: "The quotes make it a string, so JavaScript prints the characters exactly as written.",

        explain: `An **expression** is any piece of code that produces a value. \`4 * 3\` is an expression that produces \`12\`. Even a plain \`7\` is an expression: it produces 7.

JavaScript's math **operators**: \`+\` adds, \`-\` subtracts, \`*\` multiplies, \`/\` divides.

Why calculate in code instead of typing the answer? Because then the program does the work. When the numbers change, the result updates itself.`,
        how: `When the engine meets an expression, it **evaluates** it: it works out the value *before* using it. In \`console.log(3 * 4)\`, the engine first turns \`3 * 4\` into \`12\`, and only then hands \`12\` to \`console.log\`. \`console.log\` never sees the \`*\`. It only receives the result.

Like school math, \`*\` and \`/\` happen before \`+\` and \`-\`. Parentheses go first of all: \`(2 + 3) * 4\` is \`20\`, but \`2 + 3 * 4\` is \`14\`.`,

Step through the example below and watch where it stops.`,

2. Predict what the code *actually* does.
3. Compare the two.

Code that runs without errors is not the same as code that's correct.`,
        how: `There are three kinds of problems:

**Syntax errors**: broken grammar. Nothing runs. Easy to spot.

**Runtime errors**: something fails while running. The program stops with a message.

**Logic errors**: the code runs perfectly and gives the *wrong answer*. Nothing crashes, and nothing warns you.

Logic errors are the dangerous ones, and they're the kind AI makes most often. The only defense is knowing what the right answer should be and checking for it. Later you'll learn to write **tests** that do that checking automatically.`,

// ---------- Code coloring for read-only code (strings, numbers, keywords, comments) ----------
const KEYWORDS = new Set(['const', 'let', 'var', 'function', 'return', 'if', 'else', 'for', 'while', 'do', 'break', 'continue', 'true', 'false', 'null', 'undefined', 'new', 'typeof', 'async', 'await', 'try', 'catch', 'throw', 'switch', 'case', 'default', 'class', 'of', 'in']);
function hl(code) {
  const re = /(\/\/.*$|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?|`(?:[^`\\]|\\.)*`?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)/gm;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += escapeHtml(code.slice(last, m.index));
    const t = escapeHtml(m[0]);
    if (m[1]) out += `<span class="t-com">${t}</span>`;
    else if (m[2]) out += `<span class="t-str">${t}</span>`;
    else if (m[3]) out += `<span class="t-num">${t}</span>`;
    else out += KEYWORDS.has(m[0]) ? `<span class="t-key">${t}</span>` : t;
    last = re.lastIndex;
  }
  return out + escapeHtml(code.slice(last));
}

    <div class="see-box">
      <span class="see-label">What it prints</span>
      <div class="console">${k ? consoleLines(out || { logs: [] }) : '<div class="console-line muted">Nothing yet.</div>'}</div>
      <p class="step-status">${status}</p>
      <div class="row">
        <button class="btn primary sm" data-action="step" ${stopped || k >= exec.length ? 'disabled' : ''}>Step ▸</button>
        <button class="btn sm" data-action="step-all" ${stopped || k >= exec.length ? 'disabled' : ''}>Run all</button>
        <button class="btn ghost sm" data-action="step-reset" ${k ? '' : 'disabled'}>Reset</button>
      </div>
    </div>
  </div>`;
}
async function doStep(l, toEnd) {
  const exec = runnableLines(l.example), lines = l.example.split('\n');
  let k = state.step[l.id] || 0, out = state.stepOut[l.id];
  do {
    k++;
    out = await runIsolated(lines.slice(0, exec[k - 1] + 1).join('\n'));
  } while (toEnd && k < exec.length && !runError(out));
  state.step[l.id] = k; state.stepOut[l.id] = out;
  render();
}

// ---------- Quick check: multiple choice with an explanation for every answer ----------
function quizView(l) {
  const picks = state.quizPick[l.id] || {}, right = state.quizRight[l.id] || {};
  return l.quiz.map((q, qi) => {
    const pick = picks[qi], solved = !!right[qi];
    const fb = pick === undefined ? ''
      : pick === q.answer ? `<div class="feedback good"><strong>Correct.</strong>${rich(q.explain || '')}</div>`
      : `<div class="feedback bad"><strong>Not quite.</strong>${rich(q.feedback?.[pick] || 'Read the code again, one line at a time, then try another answer.')}</div>`;
    return `<div class="quiz-q ${solved ? 'solved' : ''}">
      <div class="q-head"><span class="q-num">Question ${qi + 1} of ${l.quiz.length}</span>${solved ? '<span class="badge-done">✓ Answered</span>' : ''}</div>
      <div class="task">${rich(q.question)}</div>
      ${q.code ? `<pre class="code-block">${hl(q.code)}</pre>` : ''}
      <div class="options">${q.options.map((o, oi) => {
        const cls = pick === oi ? (oi === q.answer ? 'correct' : 'wrong') : '';
        return `<button class="option ${cls}" data-action="quiz" data-q="${qi}" data-o="${oi}" ${solved ? 'disabled' : ''}><span class="option-key">${String.fromCharCode(65 + oi)}</span><span>${inline(o)}</span></button>`;
      }).join('')}</div>
      ${fb}
    </div>`;
  }).join('');
}
function answerQuiz(l, qi, oi) {
  if (state.quizRight[l.id]?.[qi]) return;
  (state.quizPick[l.id] ??= {})[qi] = oi;
  if (oi === l.quiz[qi].answer) {
    (state.quizRight[l.id] ??= {})[qi] = true;
    const firstTry = !state.quizMiss[l.id]?.[qi];
    state.xp += firstTry ? 10 : 5;
    toast(firstTry ? '✦ +10 XP · Correct first try' : '✦ +5 XP · Correct');
    maybeComplete(l);
  } else {
    (state.quizMiss[l.id] ??= {})[qi] = true;
  }
  render();
}

// A lesson is complete when every quiz question is answered correctly and the exercise (if any) has passed.
function maybeComplete(l) {
  if (state.completed.has(l.id)) return;
  const quizDone = l.quiz.every((_, i) => state.quizRight[l.id]?.[i]);
  const exDone = !l.exercise || state.exDone.has(l.id);
  if (quizDone && exDone) { state.completed.add(l.id); toast('✓ Lesson complete'); }
}

function updateFeedback(l,fb,out){state.feedback[l.id]=fb;if(out)state.outputs[l.id]=out}
async function check(l,forRun=false){const source=getCode(l);const id=l.id;const el=$('[data-action="check"]');if(el)el.disabled=true;
 const ex=l.exercise;const result=await runIsolated(source,forRun?[]:ex.tests);
 if(forRun){state.outputs[id]=result;state.feedback[id]=null;render();return}
 const checks=testResults(result,ex.tests);let fb;
 if(result.timeout||result.error){fb={kind:'bad',title:'Program could not finish',text:result.error||'Check for an infinite loop.'}}
 else if(checks.some(c=>c.error)){fb={kind:'bad',title:'Your code stopped with an error',text:checks.find(c=>c.error).error+'\n\nRead the error type and description — they tell you what went wrong.'}}
 else if(checks.every(c=>c.ok)){if(!state.exDone.has(id)){state.exDone.add(id);state.xp+=40;toast('✦ +40 XP · Exercise passed')}maybeComplete(l);fb={kind:'good',title:'All checks passed',text:ex.success||`Your program passed ${checks.length} check${checks.length===1?'':'s'}. Can you explain why it works?`};}
 else{const passed=checks.filter(c=>c.ok).length;const failed=checks.find(c=>!c.ok);state.attempts[id]=(state.attempts[id]||0)+1;fb={kind:'bad',title:`Not quite · ${passed}/${checks.length} checks passed`,text:`Expected ${safeStr(failed.expect)} but received ${safeStr(failed.actual)}. Review your logic and try again.`};}
 updateFeedback(l,fb,result);render();}
async function pgRun(){const b=$('[data-action="pg-run"]');if(b)b.disabled=true;const source=Object.values(state.playFiles).join('\n\n');const r=await runIsolated(source);state.pgOutput=r;state.pgFeedback=null;render()}
async function masteryCheck(){const m=state.modal;if(!m||m.type!=='mastery')return;const questions=masteryTasks(m.mi);const l=questions[m.step||0];const b=$('[data-action="mastery-check"]');if(b)b.disabled=true;const result=await runIsolated(m.code??l.starter,l.tests);const checks=testResults(result,l.tests);if(!result.error&&!result.timeout&&checks.every(c=>c.ok)){if((m.step||0)+1<questions.length){m.step=(m.step||0)+1;m.code=questions[m.step].starter;m.feedback={kind:'good',title:'Challenge passed',text:'Good work. Next independent challenge. Continue without hints.'};toast(`✓ Mastery task ${m.step}/${questions.length}`);}else{if(!state.mastered.has(m.mi)){state.mastered.add(m.mi);state.xp+=150;toast('◆ Module mastered · +150 XP')}m.feedback={kind:'good',title:'Mastery demonstrated',text:'You passed every independent coding challenge in this module.'};m.finished=true;}}else{const problem=checks.find(c=>!c.ok);m.feedback={kind:'bad',title:'Not passed yet',text:runError(result)||problem?.error||`One or more tests failed. ${problem?'Expected '+safeStr(problem.expect)+', received '+safeStr(problem.actual)+'.':''}`}}render()}
function handleEditorKey(e){const el=e.target;if(!['code-input','mastery-input','try-input'].includes(el.id))return;
 if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();if(el.id==='mastery-input')masteryCheck();else if(el.id==='try-input')tryRun();else if(state.view==='playground')pgRun();else check(current(),false);return}
 const start=el.selectionStart,end=el.selectionEnd,val=el.value;
 function insert(s,pos=start+ s.length){el.setRangeText(s,start,end,'end');el.selectionStart=el.selectionEnd=pos;el.dispatchEvent(new Event('input',{bubbles:true}))}
 if(e.key==='Tab'){e.preventDefault();insert('  ');return}
 if(e.key==='Enter'){e.preventDefault();const before=val.slice(0,start),indent=(before.split('\n').at(-1).match(/^\s*/)||[''])[0];const extra=/\{\s*$/.test(before)?'  ':'';insert('\n'+indent+extra);return}
 const pairs={'(':')','[':']','{':'}','"':'"',"'":"'",'`':'`'};
 if(pairs[e.key]&&!e.ctrlKey&&!e.metaKey&&!e.altKey){if(start!==end&&['(', '[', '{'].includes(e.key)){e.preventDefault();const selected=val.slice(start,end);insert(e.key+selected+pairs[e.key]);return}if(start===end&&['"',"'",'`'].includes(e.key)&&val[start]===e.key){e.preventDefault();el.selectionStart=el.selectionEnd=start+1;return}if(start===end){e.preventDefault();el.setRangeText(e.key+pairs[e.key],start,end,'end');el.selectionStart=el.selectionEnd=start+1;el.dispatchEvent(new Event('input',{bubbles:true}));return}}
 if([')',']','}'].includes(e.key)&&start===end&&val[start]===e.key){e.preventDefault();el.selectionStart=el.selectionEnd=start+1}
}
app.addEventListener('keydown',handleEditorKey);
app.addEventListener('input',e=>{saveSoon();if(e.target.id==='code-input'){if(state.view==='playground')state.playFiles[state.playActive]=e.target.value;else state.code[current().id]=e.target.value}else if(e.target.id==='try-input'){state.tryCode[current().id]=e.target.value}else if(e.target.id==='mastery-input'){if(state.modal)state.modal.code=e.target.value}else if(e.target.id==='ref-search'){const start=e.target.selectionStart;state.search=e.target.value;const list=$('.ref-list');if(list)list.innerHTML=refList();}});
app.addEventListener('click',async e=>{const button=e.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
 if(action==='close-modal'&&e.target.closest('.modal')&&e.target.closest('[data-action="close-modal"]')?.classList.contains('modal-cover'))return;
 switch(action){case 'menu':state.mobile=!state.mobile;render();break;
 case 'dashboard':showView('dashboard');break;
 case 'view':showView(button.dataset.view);break;
 case 'next':goLesson(state.selected+1);break;
 case 'prev':goLesson(state.selected-1);break;
 case 'lesson-index':goLesson(+button.dataset.index);break;
 case 'lesson-id':goLesson(flat.findIndex(l=>l.id===button.dataset.id));break;
 case 'module':state.expanded=+button.dataset.mi;showView('course');break;
 case 'toggle-module':state.expanded=state.expanded===+button.dataset.mi?-1:+button.dataset.mi;render();break;
 case 'deep':state.deep.has(button.dataset.id)?state.deep.delete(button.dataset.id):state.deep.add(button.dataset.id);render();break;
 case 'quiz':answerQuiz(current(),+button.dataset.q,+button.dataset.o);break;
 case 'step':await doStep(current(),false);break;
 case 'step-all':await doStep(current(),true);break;
 case 'step-reset':{const id=current().id;delete state.step[id];delete state.stepOut[id];render();break}
 case 'check':await check(current());break;
 case 'run':await check(current(),true);break;
 case 'hint':{const l=current();state.hints[l.id]=Math.min(l.exercise.hints.length,(state.hints[l.id]||0)+1);render();break}
 case 'reset':resetForReview(current());render();break;
 case 'pg-run':await pgRun();break;
 case 'pg-reset':state.playFiles={'main.js':'console.log("Hello, world!");','helpers.js':'function square(n) { return n * n; }'};state.playActive='main.js';state.pgOutput=null;state.pgFeedback=null;render();break;
 case 'pg-add':{let n=1;while(state.playFiles['file'+n+'.js'])n++;const name='file'+n+'.js';state.playFiles[name]='// New file\n';state.playActive=name;render();break}
 case 'pg-file':state.playActive=button.dataset.name;render();break;
 case 'reference-detail':state.modal={type:'ref',name:button.dataset.name};render();break;
 case 'copy-ref':navigator.clipboard?.writeText(button.dataset.text).then(()=>toast('Copied to clipboard')).catch(()=>toast('Copy unavailable in this browser'));break;
 case 'close-modal':state.modal=null;render();break;
 case 'mastery':{const mi=+button.dataset.mi;state.modal={type:'mastery',mi,step:0,code:masteryTasks(mi)[0].starter};render();break}
 case 'mastery-check':await masteryCheck();break;
 case 'goto-step':document.getElementById(button.dataset.target)?.scrollIntoView({behavior:'smooth',block:'start'});break;
 case 'try-run':await tryRun();break;
 case 'try-reset':{const id=current().id;delete state.tryCode[id];delete state.tryOut[id];render();break}
  case 'reset-progress':resetProgress();break;
 }});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}});
render();
})();

</script>
</body>
